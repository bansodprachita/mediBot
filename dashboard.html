<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mediBot</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sb:#C66F80;--sbl:#F4C7D0;--sbx:#FCEBF1;--mg:#4A6644;--mm:#9FAA74;--ml:#D7DAB3;--cr:#ECE3D2;--ink:#2F3B2C;--bg:#FBF6F1;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2A1D;--card:#2A3727;--ink:#F3EBDD;--cr:#34422F;--sbx:#3A2A30}}
:root[data-theme="dark"]{--bg:#1F2A1D;--card:#2A3727;--ink:#F3EBDD;--cr:#34422F;--sbx:#3A2A30}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,h4,.brand{font-family:'Fraunces',Georgia,serif;margin:0}
.brand{font-size:28px;font-weight:600}.brand i{color:var(--sb);font-weight:400}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--ml);color:var(--mg);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500}
.chip.p{background:var(--sbl);color:#7d3346}
.card{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--cr)}
.login{max-width:460px;margin:5vh auto 0}.login h1{font-size:40px;line-height:1.1;margin:10px 0 14px}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--ml);background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--mm);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--cr);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;border-radius:10px;padding:10px;background:none;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--mg);color:#fff}
.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--sb);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--mg)}.btn.o{background:none;color:var(--mg);border:1.5px solid var(--mm)}.btn.w{width:100%;margin-top:18px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.grid{display:grid;grid-template-columns:290px 1fr;gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.pl .pb{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid transparent;background:var(--sbx);border-radius:14px;padding:10px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer}
.pl .pb.on{border-color:var(--sb);background:var(--sbl);color:#4a1f2b}.pl small{display:block;opacity:.8}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font:600 1em 'Fraunces',serif;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{border-radius:16px;padding:14px}.stat b{font:600 30px 'Fraunces',serif;display:block}
.s1{background:var(--ml);color:var(--mg)}.s2{background:var(--sb);color:#fff}.s3{background:var(--cr);color:var(--ink)}
.per{display:inline-block;margin:14px 0 8px;padding:3px 14px;border-radius:99px;font-size:15px}
.morning{background:var(--ml);color:var(--mg)}.afternoon{background:var(--sbl);color:#7d3346}.evening{background:var(--sbx);color:var(--sb);border:1.5px solid var(--sbl)}.night{background:var(--mg);color:#fff}
.slot{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.slot time{font-weight:700}.slot small{display:block;opacity:.85}
.taken{background:var(--mm);color:#1f3a1b}.upcoming{background:var(--sbl);color:#5a2434}.due{background:var(--sb);color:#fff}.missed{background:var(--cr);color:var(--ink);border:2px dashed var(--sb)}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:rgba(255,255,255,.55)}
.big{background:var(--mg);color:#fff;border-radius:24px;padding:26px;margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big h2{font-size:32px;margin:4px 0}.big .btn{background:var(--sbl);color:#4a1f2b;font-size:18px;padding:14px 22px;margin-top:12px}
details{margin-top:14px;background:var(--sbx);border-radius:14px;padding:12px 14px}summary{cursor:pointer;font-weight:700;color:var(--mg)}
.hg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:8px}.hg small{display:block;opacity:.7}.hg b{display:block;margin-bottom:6px}.hg i{display:block;height:14px;border-radius:6px;margin-bottom:4px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--cr)}.sr select{width:auto;max-width:60%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;font-size:14px;z-index:120}
#toast.on{opacity:1}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--mg);color:#FBF6F1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(70vw,300px);overflow:visible;animation:drop .8s cubic-bezier(.3,1.4,.5,1) both}
.cp{transform-box:fill-box;transform-origin:center}
.h1{animation:s1 .6s .9s both ease-out}.h2{animation:s2 .6s .9s both ease-out}
@keyframes s1{to{transform:translateX(-30px) rotate(-14deg)}}@keyframes s2{to{transform:translateX(30px) rotate(14deg)}}
@keyframes drop{from{transform:translateY(-140px) rotate(-45deg);opacity:0}to{transform:none;opacity:1}}
.pp{transform-box:fill-box;transform-origin:center;animation:pop .7s 1.2s both cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translate(0,0) scale(0)}to{transform:translate(var(--x),var(--y)) scale(1)}}
.word{font:600 54px 'Fraunces',Georgia,serif;letter-spacing:.5px}
.word span{display:inline-block;opacity:0;transform:translateY(16px);animation:up .5s both;animation-delay:calc(1.7s + var(--i)*.09s)}
.word span.b{color:var(--sbl);font-style:italic;font-weight:400}
.stag{opacity:0;animation:up .6s 2.5s both;color:var(--ml)}.sk{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));opacity:.6;font-size:13px}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>

  <div class="sr" style="border:0;padding:10px 0 0"><span>👨‍⚕️ ${t('doctor')}</span><select data-f="doc">${opts(DOCS.map(d=>[d,tr(d)]),p.doc)}</select></div>${tabs()}${TAB=='history'?histView(p):`<h3>${t('today')}</h3>${sched(p)}${medForm()}`}`:`<p>${t('noPat')}</p>`}</div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a=='role'){LD.role=b.dataset.v;login()}else if(a=='go')go();else if(a=='out'){S.user=null;VIEW='main';save();login()}else if(a=='pick'){S.sel=+b.dataset.i;render()}
 else if(a=='mark')mark(b.dataset.p,+b.dataset.i);else if(a=='took')took();else if(a=='mic')mic();else if(a=='addMed')addMed();else if(a=='addPat')addPat();
 else if(a=='tab'){TAB=b.dataset.v;render()}else if(a=='settings'){VIEW='settings';render()}else if(a=='back'){VIEW='main';render()}
 else if(a=='reset'){if(!confirm(t('resetQ')))return;const pf=S.prefs;S=seed();S.prefs=pf;VIEW='main';save();render()}});
document.addEventListener('change',e=>{const el=e.target,f=el.dataset.f;if(!f)return;const v=el.type=='checkbox'?el.checked:el.value;
 if(f=='applang'){S.user.lang=v;save();render()}else if(f=='slot')$('mt').value=PT[v];else if(f=='dx')$('po').style.display=v=='other'?'block':'none';
 else if(f=='pref'){S.prefs[el.dataset.k]=el.dataset.k=='theme'?v:+v;save();render()}else if(f=='mic2'){S.user.mic=v;save()}
 else if(f=='doc'){vis()[S.sel].doc=v;save();render()}
 else if(f=='photo'){if(el.files[0])rz(el.files[0],d=>{newPhoto=d;$('pv').innerHTML=`<img class="av" style="width:56px;height:56px" src="${d}" alt="">`})}
 else{LD[f]=v;if(f=='lang'||f=='area'||f=='kind'){if(f!='lang')LD.fac='';login()}}});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(f=='name'||f=='id')LD[f]=e.target.value});
setInterval(()=>{if(S.user&&VIEW=='main'&&!document.querySelector('details[open]')&&!/INPUT|SELECT/.test(document.activeElement.tagName))render()},30000);
render();
const sp=$('splash'),end=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),700)};sp.onclick=end;
setTimeout(end,matchMedia('(prefers-reduced-motion:reduce)').matches?600:3700);
</script></body></html>
